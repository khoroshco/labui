name: Релиз

# Публикация ПРИВАТНАЯ, в реестр GitHub Packages: пакеты раздаются своим сервисам, а не
# всему свету (docs/adr/0003). Отдельный секрет для этого не нужен — публикует встроенный
# GITHUB_TOKEN, которому дано право packages: write. Видимость пакета наследуется от
# репозитория, поэтому приватный репозиторий даёт приватные пакеты.
# Корневой пакет labui помечен private — случайный publish не пройдёт.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  packages: write # публикация в GitHub Packages встроенным токеном

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@khoroshco'

      - run: npm ci

      # Гейты прогоняются здесь же: релиз не имеет права публиковать красный main.
      # Отдельный workflow на push бежал бы параллельно с CI, а не после него.
      - name: Все гейты перед публикацией
        run: npx playwright install --with-deps chromium && npm run verify

      # changesets сам решает, что делать: есть незакрытые записи — открывает PR с версиями
      # и CHANGELOG; записи уже влиты — публикует.
      - uses: changesets/action@v1
        with:
          version: npx changeset version
          publish: npx changeset publish
          commit: 'релиз: версии и CHANGELOG'
          title: 'Релиз: версии и CHANGELOG'
        env:
          # GITHUB_TOKEN — для PR с версиями, NODE_AUTH_TOKEN — для публикации в GitHub
          # Packages. Это один и тот же встроенный токен: заводить секрет вручную не нужно.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
