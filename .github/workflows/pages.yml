name: Витрина

# Витрина — статический сайт: никаких VPS и доменов, обслуживание есть, выгоды нет.
#
# СОБСТВЕННОГО ПРОГОНА ГЕЙТОВ ЗДЕСЬ НЕТ, и это не упрощение. Раньше здесь исполнялся
# полный `npm run verify` — те же гейты, что уже бежали в CI по тому же коммиту, только
# ОДНОВРЕМЕННО с ним, а не после. Смысл был в том, чтобы витрина не уехала на красном
# main. Но красного main не бывает по построению: пуш в main возможен только мёржем PR,
# а мёрж требует зелёного агрегатного чека. Проверка сторожила окно, которого нет.
#
# АВТОМАТИЧЕСКИЙ ЗАПУСК ВЕРНУЛСЯ 20.08.2026, и вот на каком основании.
#
# С 06.08 по 20.08 развёртывание было сломано: прогон собирал сайт за две минуты, отдавал
# артефакт и ДЕСЯТЬ МИНУТ опрашивал Pages, после чего экшен сдавался и ОТМЕНЯЛ
# развёртывание. Поднять ожидание нельзя — вход `timeout` у экшена ограничен теми же
# десятью минутами сверху (проверено: 1800000 отвергнуто предупреждением «timeout value
# is greater than the allowed maximum»). Триггер сняли не ради минут — репозиторий
# публичный и Actions не тарифицируются (ADR 0014), — а ради значка: прогон, который
# падает всегда и по чужой причине, перестают читать через неделю, а вместе с ним
# перестают читать и соседние.
#
# 20.08 ручной прогон прошёл ЦЕЛИКОМ ЗА 42 СЕКУНДЫ (14:12:43 → 14:13:25), и сайт отдал
# новую сборку: в бандле React-витрины появились Textarea, Select и Modal.
#
# Причинности мы не знаем. Известно совпадение: в тот же день репозиторий стал публичным
# (ADR 0014), а у публичного репозитория Pages обслуживается иначе. Доказательство здесь
# слабое — один быстрый прогон против шести оборванных, — поэтому оно записано как
# наблюдение, а не как объяснение.
#
# Если развёртывание снова начнёт виснуть: путь наружу — уйти с источника «GitHub Actions»
# на ветку gh-pages (build_type: legacy), где публикацией занимается сам Pages без
# ожидающего экшена. Это решение владельца — оно меняет способ публикации.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Сборка сайта и гейт белого листа живут в CI (джоба «Линтеры, типы, юниты»),
      # поэтому здесь сборка повторяется ради артефакта, а не проверяет.
      # Плоская раскладка — требование рантайма, а не прихоть сборки: см. CLAUDE.md.
      - run: npm run build:site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-site
      # Экшен ждёт, пока Pages доложит об успехе, и сдаётся через десять минут, ОТМЕНЯЯ
      # развёртывание. Потолок ожидания жёсткий: вход `timeout` большего значения не
      # принимает. Ровно на этом с 06.08 по 20.08 обрывалось каждое развёртывание —
      # подробности в шапке файла. Сейчас прогон укладывается в минуту.
      - id: deployment
        uses: actions/deploy-pages@v4
