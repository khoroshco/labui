name: Витрина

# Витрина — статический сайт: никаких VPS и доменов, обслуживание есть, выгоды нет.
#
# СОБСТВЕННОГО ПРОГОНА ГЕЙТОВ ЗДЕСЬ НЕТ, и это не упрощение. Раньше здесь исполнялся
# полный `npm run verify` — те же гейты, что уже бежали в CI по тому же коммиту, только
# ОДНОВРЕМЕННО с ним, а не после. Смысл был в том, чтобы витрина не уехала на красном
# main. Но красного main не бывает по построению: пуш в main возможен только мёржем PR,
# а мёрж требует зелёного агрегатного чека. Проверка сторожила окно, которого нет.
#
# АВТОМАТИЧЕСКИЙ ЗАПУСК ВЫКЛЮЧЕН, пока развёртывание сломано на стороне GitHub.
#
# Каждый прогон делает одно и то же: собирает сайт за две минуты, отдаёт артефакт и
# ДЕСЯТЬ МИНУТ опрашивает Pages, после чего экшен сдаётся и отменяет развёртывание. Сайт
# продолжает отдавать предыдущую версию.
#
# Минуты тут больше ни при чём — репозиторий публичный, и Actions не тарифицируются
# (ADR 0014). Причина осталась одна и она не про счёт: КРАСНЫЙ ЗНАЧОК НА КАЖДОМ МЁРЖЕ.
# Прогон, который падает всегда и по чужой причине, перестают читать через неделю — а
# вместе с ним перестают читать и соседние. Гейт, на который не смотрят, не гейт.
#
# Ручной запуск остался: когда Pages ускорится или мы уйдём на ветку gh-pages (см. задачу
# про витрину), витрину можно выкатить одной командой, а триггер вернуть одной строкой.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Сборка сайта и гейт белого листа живут в CI (джоба «Линтеры, типы, юниты»),
      # поэтому здесь сборка повторяется ради артефакта, а не проверяет.
      # Плоская раскладка — требование рантайма, а не прихоть сборки: см. CLAUDE.md.
      - run: npm run build:site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-site
      # ИЗВЕСТНАЯ ПОЛОМКА, И ОНА НЕ НАША.
      #
      # Экшен ждёт, пока Pages доложит об успехе, и сдаётся через десять минут, ОТМЕНЯЯ
      # развёртывание. Сторона GitHub с 06.08.2026 отвечает дольше: последнее успешное
      # шло девятнадцать минут, все следующие обрываются ровно на десятой. Поднять
      # ожидание нельзя — вход `timeout` ограничен теми же десятью минутами сверху, и
      # большее значение экшен срезает предупреждением «timeout value is greater than
      # the allowed maximum». Проверено прогоном: 1800000 отвергнуто.
      #
      # Что это значит на деле: сайт продолжает отдавать ПРЕДЫДУЩУЮ версию, сборка при
      # этом зелёная, артефакт целый. Пути наружу два — ждать, пока Pages ускорится, или
      # уходить с источника «GitHub Actions» на ветку gh-pages (build_type: legacy), где
      # развёртыванием занимается сам Pages без ожидающего экшена. Второе — решение
      # владельца: оно меняет способ публикации.
      - id: deployment
        uses: actions/deploy-pages@v4
