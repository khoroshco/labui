name: Витрина

# Витрина — статический сайт, поэтому едет на Pages сама, после каждого зелёного CI на main.
# Никаких VPS и доменов: обслуживание есть, выгоды нет.
#
# СОБСТВЕННОГО ПРОГОНА ГЕЙТОВ ЗДЕСЬ НЕТ, и это не упрощение.
#
# Раньше здесь исполнялся полный `npm run verify` — те же гейты, что уже бежали в CI по
# тому же коммиту, только ОДНОВРЕМЕННО с ним, а не после. Смысл был в том, чтобы витрина
# не уехала на красном main. Но красного main не бывает по построению: пуш в main
# возможен только мёржем PR, а мёрж требует зелёного агрегатного чека «Гейты» (защита
# ветки). То есть проверка сторожила окно, которого нет, и стоила трети минут на мёрж.
#
# Ждать завершения CI через `workflow_run` — очевидное решение, и оно НЕ РАБОТАЕТ:
# развёртывание, созданное из такого прогона, остаётся в состоянии `deployment_queued`
# до таймаута и отменяется. Проверено дважды, обе Витрины упали именно так. Поэтому
# триггер остался прежним, а лишний прогон просто убран.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Сборка сайта и гейт белого листа живут в CI (джоба «Линтеры, типы, юниты»),
      # поэтому здесь сборка повторяется ради артефакта, а не проверяет.
      # Плоская раскладка — требование рантайма, а не прихоть сборки: см. CLAUDE.md.
      - run: npm run build:site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-site
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # Экшен ЖДЁТ, пока Pages доложит об успехе, и по умолчанию сдаётся через десять
          # минут — отменяя развёртывание. Замерено по истории: сторона GitHub стала
          # отвечать примерно за девятнадцать минут, и четыре подряд Витрины упали
          # одинаково — «Timeout reached, aborting!» в состоянии deployment_queued, при
          # зелёном билде и целом артефакте. Сайт при этом продолжал отдавать прежнюю
          # версию, то есть о непроехавшей витрине не сообщал никто.
          timeout: 1800000
