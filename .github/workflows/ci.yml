name: CI

# Красный прогон блокирует мёрж: ревью человеком здесь нет, и это единственное,
# что стоит между ошибкой и main.
#
# Сюиты разведены по ПАРАЛЛЕЛЬНЫМ джобам: прогон укладывается в самую долгую из них,
# а не в их сумму.
#
# Джоба «Гейты» остаётся: она ничего не проверяет сама, а собирает результат остальных —
# так защита ветки продолжает требовать один понятный чек, а не пять.
on:
  pull_request:
  push:
    # changeset-release/** — ветка релизного PR, её создаёт changesets встроенным
    # GITHUB_TOKEN.
    #
    # ЗДЕСЬ РАНЬШЕ СТОЯЛО, ЧТО ЭТА СТРОКА ЗАКРЫВАЕТ ДЫРУ С ЧЕКАМИ. Это неправда, и она
    # измерена: за всю историю репозитория прогон CI по событию push на ветке
    # changeset-release/** случился РОВНО ОДИН РАЗ (04.08.2026), и его сделал человек
    # своим пушем. Ни один пуш самого экшена прогона не завёл — GitHub не запускает
    # workflow на события от встроенного токена, и на push это правило распространяется
    # ровно так же, как на всё остальное.
    #
    # Как чеки появляются на самом деле: GitHub заводит прогон релизного PR в состоянии
    # `action_required` и ждёт кнопки «Approve and run» от владельца. После одобрения
    # чеки встают на SHA, и защита ветки довольна. Проверено на релизе 0.4.0 (20.08.2026):
    # одобрение → «Линтеры, типы, юниты» + «Ченджсет» + «Гейты» зелёные, браузерные
    # сюиты пропущены штатно.
    #
    # Убрать ручное нажатие можно только персональным токеном в секрете — тогда ветку
    # пушит не встроенный токен и события работают. Это решение владельца: секрет живёт
    # дольше любой правки и даёт больше прав, чем GITHUB_TOKEN.
    #
    # Строка остаётся, потому что ручной пуш в релизную ветку прогон всё-таки заводит —
    # это запасной путь, а не основной.
    branches: [main, 'changeset-release/**']
  # Ручной запуск на любой ветке: чек привязан к SHA, поэтому это второй способ выдать
  # гейты ветке, которая своего прогона не получила.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: Линтеры, типы, юниты
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Браузер этой джобе не нужен вовсе — она и должна падать первой и быстро.
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - name: Сборка пакетов
        run: npm run build:tokens && npm run build:ds
      # Сайт собирается ЗДЕСЬ, а не только в Pages после мёржа. Проверка «белого листа»
      # (абсолютные пути к ассетам в подкаталоге) жила в сборке сайта, а сборка гонялась
      # только после мёржа — то есть о белой странице узнавал владелец, открыв ссылку.
      - name: Сборка сайта и гейт белого листа
        run: npm run build:site

      # Страховка к исключению выше: браузерные сюиты пропускаются на релизном PR только
      # потому, что там нечего смотреть. Если однажды туда попадёт правка исходников —
      # своя, чужая или сгенерированная, — пропуск сюит превратится в дыру. Здесь она
      # закрывается явно: состав релизного PR обязан быть тем, чем объявлен.
      - name: Релизный PR не трогает ничего, кроме версий
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'changeset-release/')
        run: node scripts/check-release-pr.mjs

  browser:
    name: ${{ matrix.suite.title }}
    # ТОЛЬКО НА PR, и это не экономия за счёт надёжности.
    #
    # Защита ветки стоит со «strict»: ветка обязана быть свежей перед мёржем, и автомёрж
    # подтягивает main сам. Значит дерево squash-коммита совпадает с деревом головы PR —
    # того самого, которое браузерные сюиты только что проверили. Прогон на main
    # пересматривал тот же код второй раз: 168 биллинг-минут из 613 за месяц, четверть
    # всего CI, и ни одной находки за всё время.
    #
    # Тот же класс, что уже вычищен у релиза и витрины: гейт, который бежит параллельно
    # тому, что его и породило. Здесь он бежал ПОСЛЕ — и всё равно по тому же дереву.
    #
    # На push в main остаётся быстрая джоба: линтеры, типы, юниты и обе сборки. Она нужна
    # не как страховка, а потому что релиз ждёт агрегатный чек этого прогона.
    # Релизный PR тоже исключён, и это не поблажка. В нём лежат ровно две вещи —
    # версии в package.json и CHANGELOG, — их пишет changesets. Браузерные сюиты там
    # проверяют, что от правки строки версии не поехала вёрстка: за всё время они
    # прогнались 36 раз и стоили 249 биллинг-минут. Что PR действительно только про
    # версии, доказывает шаг «релизный PR не трогает ничего, кроме версий» в быстрой
    # джобе: тронул исходники — прогон красный, и сюиты тут ни при чём.
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'changeset-release/')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        suite:
          # Снимки уехали в свою джобу: с переходом на матрицу реализаций их стало вдвое
          # больше (81 → 163), и вместе со smoke сюита перестала укладываться в лимит.
          - { title: Smoke, cmd: 'npm run test:smoke' }
          - { title: Снимки и визуал, cmd: 'npm run test:visual' }
          - { title: Паритет, cmd: 'npm run test:parity' }
          - { title: Доступность, cmd: 'npm run test:a11y' }
          # Витрина — своя поверхность и свой сервер: до этой сюиты её не открывал ни один
          # браузерный гейт, и она прожила четыре PR с фокусом, уходящим в невидимое.
          - { title: Витрина, cmd: 'npm run test:showcase' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Кэш браузеров Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Браузеры Playwright
        run: npx playwright install --with-deps chromium

      - name: ${{ matrix.suite.title }}
        run: ${{ matrix.suite.cmd }}

      # Диффы и отчёты кладём к прогону: разбирать «упало на снапшоте» без картинки нельзя,
      # а обновлять снапшоты не глядя запрещено правилом.
      - name: Визуальные диффы и артефакты падений
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ strategy.job-index }}
          path: test-results/
          retention-days: 14

      # Эталоны привязаны к платформе: рендер шрифта на Linux и macOS разный. Когда
      # линуксового снимка ещё нет, Playwright пишет его сам — отдаём наружу, чтобы
      # эталон можно было посмотреть глазами и закоммитить, а не «обновить не глядя».
      - name: Снятые эталоны
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: snapshots-${{ runner.os }}-${{ strategy.job-index }}
          path: tests/__screenshots__/
          retention-days: 14

  verify:
    name: Гейты
    runs-on: ubuntu-latest
    needs: [fast, browser, changeset]
    if: always()
    steps:
      # Собирает результат остальных джоб в один чек: защита ветки требует именно его.
      # «needs» с if: always() нужен, чтобы падение любой сюиты доехало сюда, а не
      # оставило чек висеть в ожидании.
      #
      # Ченджсет тоже здесь. Раньше его джоба жила сама по себе, и красная не блокировала
      # мёрж вовсе: защита ветки требует один чек, а этого чека она не касалась. То есть
      # гейт «правка исходников без записи ченджсета» существовал и ничего не держал.
      # skipped — законный результат: на push в main эта джоба не запускается.
      - name: Итог
        run: |
          if [ "${{ needs.fast.result }}" != "success" ]; then
            echo "::error::Гейты красные: линтеры «${{ needs.fast.result }}»"
            exit 1
          fi
          # skipped — законный результат для браузерных сюит на push в main: там они не
          # запускаются, потому что проверять им нечего (см. комментарий у джобы browser).
          if [ "${{ needs.browser.result }}" != "success" ] && [ "${{ needs.browser.result }}" != "skipped" ]; then
            echo "::error::Гейты красные: браузерные «${{ needs.browser.result }}»"
            exit 1
          fi
          # Но на ОБЫЧНОМ PR пропуск браузерных сюит недопустим: там они и есть проверка.
          # Релизный PR — исключение с собственным гейтом на состав (см. джобу «Линтеры»).
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ needs.browser.result }}" != "success" ] && [ "${{ startsWith(github.head_ref, 'changeset-release/') }}" != "true" ]; then
            echo "::error::На PR браузерные сюиты обязаны отработать, а не быть пропущены"
            exit 1
          fi
          if [ "${{ needs.changeset.result }}" != "success" ] && [ "${{ needs.changeset.result }}" != "skipped" ]; then
            echo "::error::Ченджсет «${{ needs.changeset.result }}»: правка исходников без записи уедет к потребителю молча"
            exit 1
          fi
          echo "Все гейты зелёные"

  changeset:
    name: Ченджсет
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Правка исходников без записи ченджсета — это смена контракта, которая уедет
      # к потребителю молча. Именно так у нас переименовывались пропсы.
      - name: Ченджсет обязателен для правок в src/
        run: node scripts/check-changeset.mjs
