<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Рантайм иначе перечитывает документ вторым запросом и пересобирает шаблон поверх уже
     смонтированного дерева. Второй разбор отличается от первого ТОЛЬКО регистром имён
     атрибутов (onClick → onclick), который рантайм нормализует сам, — то есть не даёт ничего,
     а RowLabel на нём падал целиком: «removeChild … not a child of this node». Флаг —
     собственная ручка рантайма. Подробности: CLAUDE.md, раздел «Репозиторий». -->
<script>window.__resources = {};</script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="ds.css">
<script src="g-icon.js"></script>
</helmet>
<span style="display:grid; grid-template-rows:{{ rows }}; transition:{{ trans }}">
  <span style="overflow:hidden; min-height:0; display:block">
    <span role="{{ role }}" aria-live="{{ live }}" style="display:flex; align-items:flex-start; gap:var(--sp-15); padding:0 0 var(--sp-3); font-size:var(--fs-s); font-weight:var(--fw-regular); color:{{ color }}; line-height:var(--lh-ui)"><span style="display:flex; align-items:center; height:16px; flex:none; position:relative; top:-1px"><g-icon name="{{ icon }}" size="12"></g-icon></span>{{ msg }}</span>
  </span>
</span>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 360, &quot;height&quot;: 60},
&quot;text&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;Токен — латиница и цифры, минимум 11 символов&quot;, &quot;tsType&quot;: &quot;string&quot;},
&quot;level&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;ok&quot;, &quot;warn&quot;, &quot;danger&quot;], &quot;default&quot;: &quot;danger&quot;, &quot;tsType&quot;: &quot;'ok' | 'warn' | 'danger'&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props, level = p.level ?? 'ok', msg = p.text ?? '';
    const open = !!msg && (level === 'danger' || level === 'warn');
    // Выход — жест ОДНОГО сообщения: пока полоса схлопывается, она обязана выглядеть
    // так же, как выглядела открытой. У ok нет своей внешности (это «нет сообщения»),
    // поэтому без запоминания он проваливался в ветку danger и warn на 200 мс краснел.
    // По той же причине держим последний непустой текст: иначе он пропадал мгновенно,
    // а пустая коробка дозакрывалась сама.
    if (open) { this._shownLevel = level; this._shownMsg = msg; }
    const shown = open ? level : (this._shownLevel ?? 'danger');
    const isWarn = shown === 'warn';
    return {
      rows: open ? '1fr' : '0fr',
      msg: open ? msg : (this._shownMsg ?? ''),
      trans: open ? 'grid-template-rows .3s var(--ease-out)' : 'grid-template-rows .2s var(--ease-in)',
      color: isWarn ? 'var(--warn)' : 'var(--danger)',
      icon: isWarn ? 'triangle-exclamation-fill' : 'circle-exclamation-fill',
      // ошибка озвучивается при появлении; danger — assertive, warn — polite.
      // Закрытое сообщение живой областью быть перестаёт — иначе уходящий текст
      // переозвучивался бы уже после того, как проблема исправлена.
      role: !open ? 'presentation' : (level === 'danger' ? 'alert' : 'status'),
      live: !open ? 'off' : (level === 'danger' ? 'assertive' : 'polite'),
    };
  }
}
</script>
</body>
</html>
