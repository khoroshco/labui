<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Рантайм иначе перечитывает документ вторым запросом и пересобирает шаблон поверх уже
     смонтированного дерева. Второй разбор отличается от первого ТОЛЬКО регистром имён
     атрибутов (onClick → onclick), который рантайм нормализует сам, — то есть не даёт ничего,
     а RowLabel на нём падал целиком: «removeChild … not a child of this node». Флаг —
     собственная ручка рантайма. Подробности: CLAUDE.md, раздел «Репозиторий». -->
<script>window.__resources = {};</script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="ds.css">
<script src="g-icon.js"></script>
</helmet>
<div style="display:flex; flex-direction:column; align-items:center; text-align:center; gap:var(--sp-3); padding:var(--sp-7) var(--sp-5)">
  <span style="display:inline-flex; align-items:center; justify-content:center; width:56px; height:56px; border-radius:var(--r-full); background:{{ iconBg }}; color:{{ iconColor }}; flex:none"><g-icon name="{{ icon }}" size="24"></g-icon></span>
  <div style="display:flex; flex-direction:column; gap:var(--sp-15); max-width:var(--measure-narrow)">
    <div style="font-size:var(--fs-l); font-weight:var(--fw-medium); color:var(--text-primary); line-height:var(--lh-ui); text-wrap:pretty">{{ label }}</div>
    <sc-if value="{{ hasSubtitle }}" hint-placeholder-val="{{ true }}"><div style="font-size:var(--fs-m); font-weight:var(--fw-regular); color:var(--text-secondary); line-height:var(--lh-text); text-wrap:pretty">{{ subtitle }}</div></sc-if>
  </div>
  <sc-if value="{{ hasAction }}" hint-placeholder-val="{{ false }}">
    <span style="margin-top:var(--sp-1)"><dc-import name="Button" label="{{ actionLabel }}" icon="{{ actionIcon }}" variant="secondary" size="s" on-click="{{ act }}" hint-size="150px,36px"></dc-import></span>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 380, &quot;height&quot;: 260},
&quot;variant&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;empty&quot;, &quot;error&quot;], &quot;default&quot;: &quot;empty&quot;, &quot;tsType&quot;: &quot;'empty'|'error'&quot;, &quot;section&quot;: &quot;Вид&quot;},
&quot;label&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;Пока нет форматов&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Контент&quot;},
&quot;subtitle&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;Добавьте первый баннер — он появится здесь вместе с остальной раскладкой.&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Контент&quot;},
&quot;icon&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;&quot;, &quot;picture&quot;, &quot;circle-exclamation&quot;, &quot;folder&quot;, &quot;magnifier&quot;, &quot;layers&quot;], &quot;default&quot;: &quot;&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Контент&quot;},
&quot;actionLabel&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;Добавить баннер&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Действие&quot;},
&quot;onAction&quot;: {&quot;editor&quot;: null, &quot;tsType&quot;: &quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  // Заглушка НА МЕСТЕ контента, когда показывать нечего: empty (нейтрально) или error (сбой).
  // Не всплывает поверх — занимает место списка. Эфемерное событие — это Toast, не экран.
  //
  // Было: title вместо label (везде в системе контент это label) и три плоских пропса
  // actionLabel/actionIcon/actionVariant — то есть Button, переписанный пропсами наружу.
  // Стало: имена как во всей системе, а вид кнопки принадлежит EmptyState (secondary):
  // выбирать иерархию кнопки снаружи не нужно — в пустом экране действие всегда одно.
  renderVals() {
    const p = this.props;
    const variant = p.variant ?? 'empty';
    const V = {
      empty: { icon: 'picture', bg: 'var(--bg-hover)', color: 'var(--text-tertiary)' },
      error: { icon: 'circle-exclamation', bg: 'var(--danger-dim)', color: 'var(--danger)' },
    };
    const v = V[variant] ?? V.empty;
    const actionLabel = p.actionLabel ?? '';
    return {
      icon: p.icon || v.icon, iconBg: v.bg, iconColor: v.color,
      label: p.label ?? '', subtitle: p.subtitle ?? '', hasSubtitle: !!(p.subtitle ?? ''),
      // действие опционально: нет подписи — нет кнопки
      hasAction: !!actionLabel, actionLabel,
      // иконку действия выбирает вид, а не вызывающий: в пустом экране это «добавить»,
      // в ошибке — «повторить». Прокидывать её снаружи значит переписывать Button пропсами.
      actionIcon: variant === 'error' ? 'arrows-rotate-right' : 'plus',
      act: p.onAction ?? (() => {}),
    };
  }
}
</script>
</body>
</html>
