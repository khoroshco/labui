<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>SwitchRow · Banner Lab DS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Рантайм иначе перечитывает документ вторым запросом и пересобирает шаблон поверх уже
     смонтированного дерева. Второй разбор отличается от первого ТОЛЬКО регистром имён
     атрибутов (onClick → onclick), который рантайм нормализует сам, — то есть не даёт ничего,
     а RowLabel на нём падал целиком: «removeChild … not a child of this node». Флаг —
     собственная ручка рантайма. Подробности: CLAUDE.md, раздел «Репозиторий». -->
<script>window.__resources = {};</script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="ds.css">
<script src="focus-modality.js"></script>
</helmet>
  <!-- Корень ряда — div, а НЕ label. Внутри лежат свои label-контролы (Toggle, Checkbox,
       Input), а вложенные label запрещены: браузер на клик внутри порождал второе,
       активационное событие от имени внешнего label — с другим target, мимо гейта ⓘ.
       Отсюда был баг «клик по ⓘ открывает подсказку И флипает тоггл». Ряд и так сам
       себе контрол: role, aria-checked, tabindex и клавиатура у него собственные,
       а label ему нечего подписывать — for/вложенного input у него нет. -->
  <div data-row="true" data-disabled="{{ disabledAttr }}" tabindex="{{ tabIdx }}" role="switch" aria-checked="{{ ariaChecked }}" aria-disabled="{{ disabledAttr }}" onKeyDown="{{ key }}" onMouseDown="{{ noFocus }}" onClick="{{ flip }}" style="position:relative; display:flex; flex-direction:column; padding:0 var(--sp-4); cursor:pointer">
  <span style="display:flex; align-items:center; justify-content:space-between; min-height:var(--row-h); gap:var(--sp-3); padding:{{ padV }} 0">
    <dc-import name="RowLabel" label="{{ label }}" subtitle="{{ subtitle }}" has-info="{{ hasInfo }}" open="{{ infoOpen }}" on-toggle="{{ toggleInfo }}" hint-size="160px,20px"></dc-import>
    <dc-import name="Toggle" bare="{{ true }}" checked="{{ on }}" disabled="{{ disabled }}" hint-size="36px,21px"></dc-import>
  </span>
  <dc-import name="RowInfo" open="{{ infoOpen }}" text="{{ info }}" image="{{ infoImage }}" hint-size="100%,0px"></dc-import>
  <dc-import name="RowMsg" text="{{ msg }}" level="{{ msgLevel }}" hint-size="100%,0px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 380, &quot;height&quot;: 130},
&quot;label&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;Запекать в растр&quot;, &quot;tsType&quot;: &quot;string&quot;},
&quot;subtitle&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;&quot;, &quot;tsType&quot;: &quot;string&quot;},
&quot;checked&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot;},
&quot;disabled&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot;},
&quot;info&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;&quot;, &quot;tsType&quot;: &quot;string&quot;},
&quot;infoImage&quot;: {&quot;editor&quot;: null, &quot;tsType&quot;: &quot;string&quot;},
&quot;msg&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;&quot;, &quot;tsType&quot;: &quot;string&quot;},
&quot;msgLevel&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;ok&quot;, &quot;warn&quot;], &quot;default&quot;: &quot;ok&quot;, &quot;tsType&quot;: &quot;'ok'|'warn'&quot;},
&quot;onChange&quot;: {&quot;editor&quot;: null, &quot;tsType&quot;: &quot;(checked: boolean) =&gt; void&quot;}}">
class Component extends DCLogic {
  state = { on: null, infoOpen: false };
  renderVals() {
    const p = this.props, noop = () => {};
    // Управление ряда — то же, что у атомов: пришёл колбэк, значит значением владеет
    // родитель и ряд показывает ровно переданное. Иначе экран, отказавший в смене,
    // видел бы ряд уже перещёлкнутым: своё состояние переживало чужой отказ.
    const controlled = typeof p.onChange === 'function';
    const on = controlled ? !!p.checked : (this.state.on ?? !!p.checked);
    const hasInfo = !!p.info;
    const open = hasInfo && this.state.infoOpen;
    // мышиный клик (detail>0) снимает фокус с ряда — действие мгновенное; клавиатура фокус сохраняет
    const disabled = !!p.disabled;
    // Клик по ⓘ не должен дёргать действие ряда. RowLabel гасит всплытие у себя,
    // но полагаться только на это нельзя: ⓘ — отдельный компонент со своим маунтом,
    // и порядок обработчиков между маунтами не гарантирован. Ряд сам игнорирует
    // клики, пришедшие из кнопки-раскрывашки.
    const fromInfo = (e) => !!(e && e.target && e.target.closest && e.target.closest('button[aria-expanded]'));
    const flip = (e) => { if (disabled || fromInfo(e)) return; if (e && e.detail > 0 && e.currentTarget) e.currentTarget.blur(); if (!controlled) this.setState({ on: !on }); (p.onChange ?? noop)(!on); };
    return {
      label: p.label ?? '', subtitle: p.subtitle ?? '',
      ariaChecked: on ? 'true' : 'false',
      padV: p.subtitle ? '7px' : '0',
      on, flip, disabled,
      tabIdx: disabled ? '-1' : '0',
      disabledAttr: disabled ? 'true' : 'false',
      // мышиный клик не должен оставлять фокус на ряду: действие мгновенное, ряд не «активен» после него; фокус-кольцо — только с клавиатуры
      noFocus: (e) => e.preventDefault(),
      key: (e) => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flip(null); } },
      hasInfo, info: p.info ?? '', infoImage: p.infoImage ?? '', infoOpen: open,
      toggleInfo: () => this.setState(s => ({ infoOpen: !s.infoOpen })),
      // У тоггла ОШИБКИ не бывает: оба состояния валидны, требовать «исправить»
      // включённость нечего. Но ПРЕДУПРЕЖДЕНИЕ бывает — оно говорит не «неверно»,
      // а «вот последствие выбора» («растр увеличит вес макета»). Поэтому error
      // здесь понижается до warn, а не показывается красным.
      msg: p.msg ?? '',
      msgLevel: (p.msgLevel ?? 'ok') === 'ok' ? 'ok' : 'warn',
    };
  }
}
</script>
</body>
</html>
