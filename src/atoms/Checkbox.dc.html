<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Рантайм иначе перечитывает документ вторым запросом и пересобирает шаблон поверх уже
     смонтированного дерева. Второй разбор отличается от первого ТОЛЬКО регистром имён
     атрибутов (onClick → onclick), который рантайм нормализует сам, — то есть не даёт ничего,
     а RowLabel на нём падал целиком: «removeChild … not a child of this node». Флаг —
     собственная ручка рантайма. Подробности: CLAUDE.md, раздел «Репозиторий». -->
<script>window.__resources = {};</script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="ds.css">
<script src="g-icon.js"></script>
<script src="focus-modality.js"></script>
</helmet>
<label tabindex="{{ tabIdx }}" role="{{ role }}" aria-hidden="{{ ariaHidden }}" aria-checked="{{ ariaChecked }}" aria-disabled="{{ ariaDisabled }}" aria-invalid="{{ ariaInvalid }}" aria-label="{{ aria }}" onKeyDown="{{ key }}" onClick="{{ toggle }}" style="display:flex; width:fit-content; align-items:center; gap:var(--sp-2); cursor:{{ cursor }}; user-select:none; pointer-events:{{ pe }}">
  <span data-box="true" style="display:inline-flex; align-items:center; justify-content:center; width:{{ boxSz }}; height:{{ boxSz }}; border-radius:{{ boxR }}; border:1px solid {{ border }}; background:{{ bg }}; color:{{ chkColor }}; transition:background .25s ease, border-color .25s ease; flex:none"><span style="display:flex; transform:{{ scale }}; transition:transform .35s var(--ease-spring)"><g-icon name="check" size="{{ iconSz }}"></g-icon></span></span>
  <sc-if value="{{ hasLabel }}" hint-placeholder-val="{{ true }}"><span style="font-size:var(--fs-m); line-height:var(--lh-ui); color:{{ txtColor }}; position:relative; top:0.5px">{{ text }}</span></sc-if>
</label>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 300, &quot;height&quot;: 48},
&quot;label&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;Применить ко всем форматам&quot;, &quot;tsType&quot;: &quot;string&quot;},
&quot;checked&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;},
&quot;invalid&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot;},
&quot;disabled&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot;},
&quot;ariaLabel&quot;: {&quot;editor&quot;: null, &quot;tsType&quot;: &quot;string&quot;},
&quot;bare&quot;: {&quot;editor&quot;: null, &quot;tsType&quot;: &quot;boolean&quot;},
&quot;onChange&quot;: {&quot;editor&quot;: null, &quot;tsType&quot;: &quot;(on: boolean) =&gt; void&quot;}}">
class Component extends DCLogic {
  state = { on: null };
  // Контрол без имени невидим для скринридера. Подпись даёт label; если она лежит
  // СНАРУЖИ (ряд собран не нашим CheckboxRow, панель пропсов) — нужен ariaLabel.
  // bare — исключение: там семантику и имя несёт родительский ряд.
  componentDidMount() {
    const p = this.props;
    if (!p.bare && !(p.label ?? '') && !(p.ariaLabel ?? '')) {
      console.warn('Checkbox: нет ни label, ни ariaLabel — контрол безымянный для скринридера');
    }
  }
  renderVals() {
    const p = this.props, bare = !!p.bare, disabled = !!p.disabled;
    // выключенное — потолок яркости: ошибку у disabled не показываем (иначе красный ярче гашения)
    const invalid = !!p.invalid && !disabled;
    // bare: чисто визуал, состоянием и вводом владеет родитель (напр. ряд Island)
    const controlled = typeof p.onChange === 'function';
    const on = (bare || controlled) ? !!p.checked : (this.state.on ?? !!(p.checked ?? false));
    const flip = () => { if (bare || disabled) return; if (!controlled) this.setState({ on: !on }); else p.onChange(!on); };
    return {
      text: p.label ?? '', hasLabel: !!(p.label ?? ''),
      ariaChecked: on ? 'true' : 'false', ariaDisabled: disabled ? 'true' : 'false',
      // bare: семантику несёт родительский ряд — прячем свою роль
      role: bare ? undefined : 'checkbox', ariaHidden: bare ? 'true' : undefined,
      aria: (p.label ?? '') ? undefined : (p.ariaLabel ?? undefined),
      boxSz: '18px', boxR: '5px', iconSz: 12,
      tabIdx: (bare || disabled) ? '-1' : '0', pe: bare ? 'none' : 'auto', cursor: bare ? 'default' : disabled ? 'not-allowed' : 'pointer',
      // disabled — единый язык ДС: text-disabled + приглушённая поверхность (без ad-hoc opacity)
      txtColor: disabled ? 'var(--text-disabled)' : 'var(--text-primary)',
      // ИНВАРИАНТ: внутри disabled ничто не ярче --text-disabled. Было --text-tertiary,
      // то есть галочка светилась ярче собственного порога гашения.
      chkColor: disabled ? 'var(--text-disabled)' : 'var(--inverse-text)',
      // Ошибка красит чекбокс ЦЕЛИКОМ тем же --danger, что сообщение ряда: отмеченный
      // становится красной заливкой с белой галочкой, снятый — красной рамкой.
      // Раньше отмеченный оставался тёмным и лишь обводился красным — читалось как
      // «рамка в рамке», а не как ошибка.
      bg: disabled ? (on ? 'var(--bg-active)' : 'transparent') : (on && invalid) ? 'var(--danger)' : on ? 'var(--inverse-bg)' : 'transparent',
      border: disabled ? 'var(--border)' : invalid ? 'var(--danger)' : on ? 'var(--inverse-bg)' : 'var(--border-strong)',
      ariaInvalid: invalid ? 'true' : undefined,
      scale: on ? 'scale(1)' : 'scale(0)',
      toggle: flip,
      key: (e) => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flip(); } },
    };
  }
}
</script>
</body>
</html>
